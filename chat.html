<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saskatchewan Utilities Customer Service Bot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 500px;
            height: 600px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: #2c5282;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .chat-header h1 {
            font-size: 20px;
            margin-bottom: 5px;
        }

        .chat-header p {
            font-size: 13px;
            opacity: 0.9;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f7fafc;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.bot {
            justify-content: flex-start;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.4;
        }

        .bot .message-content {
            background: #e2e8f0;
            color: #2d3748;
            border-bottom-left-radius: 4px;
        }

        .user .message-content {
            background: #2c5282;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .quick-replies {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
            animation: slideIn 0.3s ease-out;
        }

        .quick-reply-btn {
            background: white;
            border: 2px solid #2c5282;
            color: #2c5282;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .quick-reply-btn:hover {
            background: #2c5282;
            color: white;
        }

        .chat-input {
            padding: 20px;
            background: white;
            border-top: 1px solid #e2e8f0;
            display: flex;
            gap: 10px;
        }

        .chat-input input {
            flex: 1;
            padding: 12px;
            border: 1px solid #cbd5e0;
            border-radius: 24px;
            font-size: 14px;
            outline: none;
        }

        .chat-input input:focus {
            border-color: #2c5282;
        }

        .chat-input button {
            background: #2c5282;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 24px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.2s;
        }

        .chat-input button:hover {
            background: #1a365d;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
            background: #e2e8f0;
            border-radius: 12px;
            border-bottom-left-radius: 4px;
            width: fit-content;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #718096;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-10px);
            }
        }

        .service-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            margin-right: 6px;
        }

        .badge-sasktel { background: #0066cc; color: white; }
        .badge-saskpower { background: #00a651; color: white; }
        .badge-saskenergy { background: #ff6b35; color: white; }
        .badge-sgi { background: #d32f2f; color: white; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>🏢 Saskatchewan Services Assistant</h1>
            <p>SaskTel • SaskPower • SaskEnergy • SGI</p>
        </div>

        <div class="chat-messages" id="chatMessages">
            <!-- Messages will be added here -->
        </div>

        <div class="chat-input">
            <input type="text" id="userInput" placeholder="Type your question..." autocomplete="off">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');

        // Initial greeting
        window.onload = function() {
            setTimeout(() => {
                addBotMessage("Hello! I'm your Saskatchewan Services Assistant. I can help you with questions about SaskTel, SaskPower, SaskEnergy, and SGI.");
                setTimeout(() => {
                    showQuickReplies([
                        "SaskTel Support",
                        "SaskPower Support",
                        "SaskEnergy Support",
                        "SGI Support"
                    ]);
                }, 800);
            }, 500);
        };

        // Knowledge base for each service
        const knowledgeBase = {
            sasktel: {
                name: "SaskTel",
                badge: "badge-sasktel",
                keywords: ["sasktel", "internet", "phone", "cell", "mobile", "wifi", "data", "plan", "bill"],
                faqs: {
                    "bill": "You can view and pay your SaskTel bill online through MySaskTel or set up automatic payments. Bills are typically due on the 21st of each month.",
                    "outage": "To report an internet or phone outage, you can check the SaskTel service status page or call 1-800-SASKTEL (1-800-727-5835).",
                    "plan": "SaskTel offers various plans for internet, TV, and mobile services. You can compare plans and upgrade online or speak with a representative."
                }
            },
            saskpower: {
                name: "SaskPower",
                badge: "badge-saskpower",
                keywords: ["saskpower", "power", "electricity", "outage", "meter", "hydro", "electric"],
                faqs: {
                    "bill": "SaskPower bills are typically issued monthly. You can view your bill, usage history, and payment options through your MySaskPower account.",
                    "outage": "To report a power outage, call 310-2220 (no area code needed) or report it through the SaskPower app. For emergency situations, call 1-888-757-6937.",
                    "meter": "SaskPower is transitioning to smart meters. You can view your meter reading online or submit a reading through your MySaskPower account."
                }
            },
            saskenergy: {
                name: "SaskEnergy",
                badge: "badge-saskenergy",
                keywords: ["saskenergy", "gas", "natural gas", "heating", "furnace"],
                faqs: {
                    "bill": "SaskEnergy bills can be viewed and paid online. Equal payment plans are available to help manage seasonal variations in gas usage.",
                    "leak": "If you smell gas or suspect a gas leak, leave the area immediately and call SaskEnergy's 24-hour emergency line at 1-888-700-0427 from a safe location.",
                    "service": "For new service connections or reconnections, contact SaskEnergy at 1-800-567-8899 or submit a request through their website."
                }
            },
            sgi: {
                name: "SGI",
                badge: "badge-sgi",
                keywords: ["sgi", "insurance", "auto", "vehicle", "registration", "claim", "accident", "driver"],
                faqs: {
                    "claim": "To report a claim, call SGI's Claims Contact Centre at 1-800-667-9868 available 24/7. You can also start a claim online through mySGI.",
                    "registration": "Vehicle registrations can be renewed online through mySGI or at any SGI motor license issuer. You'll receive a renewal notice about 30 days before expiry.",
                    "insurance": "SGI provides mandatory Auto Fund insurance for all Saskatchewan vehicles. For additional coverage, you can contact an SGI Auto Fund broker."
                }
            }
        };

        function addMessage(content, isUser) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'bot'}`;
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.innerHTML = content;
            
            messageDiv.appendChild(contentDiv);
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function addBotMessage(message) {
            addMessage(message, false);
        }

        function addUserMessage(message) {
            addMessage(message, true);
        }

        function showTypingIndicator() {
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message bot';
            typingDiv.id = 'typing-indicator';
            
            const indicator = document.createElement('div');
            indicator.className = 'typing-indicator';
            indicator.innerHTML = '<span></span><span></span><span></span>';
            
            typingDiv.appendChild(indicator);
            chatMessages.appendChild(typingDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function removeTypingIndicator() {
            const indicator = document.getElementById('typing-indicator');
            if (indicator) {
                indicator.remove();
            }
        }

        function showQuickReplies(options) {
            const repliesDiv = document.createElement('div');
            repliesDiv.className = 'quick-replies';
            
            options.forEach(option => {
                const btn = document.createElement('button');
                btn.className = 'quick-reply-btn';
                btn.textContent = option;
                btn.onclick = () => handleQuickReply(option);
                repliesDiv.appendChild(btn);
            });
            
            chatMessages.appendChild(repliesDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function handleQuickReply(reply) {
            // Remove all quick reply buttons
            document.querySelectorAll('.quick-replies').forEach(el => el.remove());
            
            addUserMessage(reply);
            processMessage(reply.toLowerCase());
        }

        function identifyService(message) {
            for (const [key, service] of Object.entries(knowledgeBase)) {
                if (service.keywords.some(keyword => message.includes(keyword))) {
                    return key;
                }
            }
            return null;
        }

        function processMessage(message) {
            showTypingIndicator();
            
            setTimeout(() => {
                removeTypingIndicator();
                
                const service = identifyService(message);
                
                if (service) {
                    const serviceData = knowledgeBase[service];
                    
                    // Check for specific FAQ matches
                    let faqMatch = null;
                    for (const [key, answer] of Object.entries(serviceData.faqs)) {
                        if (message.includes(key)) {
                            faqMatch = answer;
                            break;
                        }
                    }
                    
                    if (faqMatch) {
                        addBotMessage(`<span class="service-badge ${serviceData.badge}">${serviceData.name}</span>${faqMatch}`);
                        
                        setTimeout(() => {
                            addBotMessage("Is there anything else I can help you with?");
                            showQuickReplies([
                                "Request Callback",
                                "Chat with Agent",
                                "Another Question"
                            ]);
                        }, 1000);
                    } else {
                        // General service routing
                        addBotMessage(`<span class="service-badge ${serviceData.badge}">${serviceData.name}</span>I can help you with ${serviceData.name} questions. What do you need help with?`);
                        
                        setTimeout(() => {
                            const topics = Object.keys(serviceData.faqs).map(k => 
                                k.charAt(0).toUpperCase() + k.slice(1) + " Info"
                            );
                            topics.push("Speak to Agent");
                            showQuickReplies(topics);
                        }, 800);
                    }
                } else if (message.includes("callback") || message.includes("call back")) {
                    addBotMessage("I'd be happy to arrange a callback for you. A representative will contact you within 24 hours. Which service do you need help with?");
                    showQuickReplies(["SaskTel", "SaskPower", "SaskEnergy", "SGI"]);
                } else if (message.includes("agent") || message.includes("representative")) {
                    addBotMessage("I'm connecting you to our next available agent. Please hold while I transfer you...");
                    setTimeout(() => {
                        addBotMessage("📞 <em>In a real implementation, this would connect to the appropriate service's live chat system.</em>");
                    }, 2000);
                } else {
                    addBotMessage("I can help you with questions about SaskTel, SaskPower, SaskEnergy, or SGI. Which service do you need assistance with?");
                    showQuickReplies([
                        "SaskTel",
                        "SaskPower",
                        "SaskEnergy",
                        "SGI"
                    ]);
                }
            }, 1000);
        }

        function sendMessage() {
            const message = userInput.value.trim();
            
            if (message === '') return;
            
            addUserMessage(message);
            userInput.value = '';
            
            processMessage(message.toLowerCase());
        }

        // Allow Enter key to send message
        userInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
